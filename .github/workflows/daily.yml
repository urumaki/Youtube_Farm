name: Daily kingdom

on:
  schedule:
    - cron: '17 6 * * *' # once a day, 06:17 UTC
  workflow_dispatch:
    inputs:
      subs:
        description: 'Override subscriber count (blank = fetch from YouTube)'
        required: false
      lang:
        description: 'Narration language (en or it)'
        required: false
        default: 'en'

permissions:
  contents: write # commit state/ and state/history/

concurrency:
  group: daily-kingdom
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 340 # software rendering on a 4-core runner takes ~2-2.5 h
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium
          sudo apt-get update && sudo apt-get install -y ffmpeg

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache TTS models
        uses: actions/cache@v4
        with:
          path: tools
          key: tts-kokoro-v1.0-piper-2023.11.14-2

      - name: Set up TTS (Kokoro + Piper fallback)
        run: npm run setup:tts

      - name: Tests
        run: npm test

      - name: Daily cycle (fetch, simulate, render)
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          COUNT_MODE: ${{ vars.COUNT_MODE || 'public' }}
          YT_OAUTH_CLIENT_ID: ${{ secrets.YT_OAUTH_CLIENT_ID }}
          YT_OAUTH_CLIENT_SECRET: ${{ secrets.YT_OAUTH_CLIENT_SECRET }}
          YT_OAUTH_REFRESH_TOKEN: ${{ secrets.YT_OAUTH_REFRESH_TOKEN }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          TTS_PROVIDER: ${{ vars.TTS_PROVIDER || 'kokoro' }}
          PUBLISH_TARGETS: ${{ vars.PUBLISH_TARGETS }}
          YT_PRIVACY: ${{ vars.YT_PRIVACY || 'public' }}
          YT_PUBLISH_AT: ${{ vars.YT_PUBLISH_AT }}
        run: |
          ARGS="--lang ${{ github.event.inputs.lang || 'en' }}"
          if [ -n "${{ github.event.inputs.subs }}" ]; then ARGS="$ARGS --subs ${{ github.event.inputs.subs }}"; fi
          npm run daily -- $ARGS

      - name: Commit state and history
        run: |
          git config user.name "subscriber-kingdom-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/  # includes state/published.json (uploaded video ids)
          if git diff --cached --quiet; then echo "no state change"; exit 0; fi
          git commit -m "Kingdom day $(date -u +%F)"
          # the branch may have moved during the long render: rebase the state commit, retry
          for i in 1 2 3 4; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((i * 10))
          done
          exit 1

      - name: Upload video
        uses: actions/upload-artifact@v4
        with:
          name: kingdom-${{ github.run_id }}
          path: |
            output/*.mp4
            output/*.json
          retention-days: 30
